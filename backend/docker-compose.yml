services:
  platform:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./agent-config:/app/agent-config:ro
    networks:
      - openclaw

networks:
  openclaw:
    name: openclaw-agents
    # The network is also used by agent containers spawned via the Docker SDK
    # (backend/app/services/orchestrator.py), so we treat it as externally
    # owned — Compose attaches to it but doesn't create or destroy it.
    # Either start-mac-compose.sh or start-mac.sh creates it if missing.
    external: true
